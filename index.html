<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Configurações para ficar com cara de App de Celular (PWA) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020617">
  <title>Divisor do JP</title>

  <!-- Tailwind CSS para o visual bonitão -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e Babel para rodar direto no navegador sem instalar nada -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Ícones convertidos para SVG para funcionar no arquivo único
    const IconWallet = ({size=24, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a8 8 0 0 1-5.33 7.59A2 2 0 0 1 14 20H5a2 2 0 0 1-2-2V7h16Z"/><path d="M22 12v4h-3a2 2 0 0 1 0-4h3Z"/></svg>;
    const IconSettings = ({size=20, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
    const IconArrowLeft = ({size=20, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
    const IconPlus = ({size=20, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const IconTrash2 = ({size=18, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const IconPieChart = ({size=16, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
    const IconAlertCircle = ({size=18, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
    const IconCheckCircle2 = ({size=16, className=""}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;

    function App() {
      const [amount, setAmount] = useState('');
      const [isAdmin, setIsAdmin] = useState(false);

      // Carrega as categorias do LocalStorage ou usa as padrão do JP
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('jp_app_categories');
        if (saved) {
          return JSON.parse(saved);
        }
        return [
          { id: 1, name: 'Reserva de Emergência', percentage: 20, color: 'text-blue-400', bg: 'bg-blue-400/10' },
          { id: 2, name: 'Moto 🏍️', percentage: 30, color: 'text-green-400', bg: 'bg-green-400/10' },
          { id: 3, name: 'Lucro 💰', percentage: 50, color: 'text-purple-400', bg: 'bg-purple-400/10' },
        ];
      });

      // Salva no LocalStorage do celular toda vez que o JP mudar algo
      useEffect(() => {
        localStorage.setItem('jp_app_categories', JSON.stringify(categories));
      }, [categories]);

      const colorOptions = [
        { text: 'text-pink-400', bg: 'bg-pink-400/10' },
        { text: 'text-yellow-400', bg: 'bg-yellow-400/10' },
        { text: 'text-orange-400', bg: 'bg-orange-400/10' },
        { text: 'text-teal-400', bg: 'bg-teal-400/10' },
      ];

      const totalPercentage = categories.reduce((acc, cat) => acc + (Number(cat.percentage) || 0), 0);
      const isTotalValid = totalPercentage === 100;

      const formatCurrency = (value) => {
        const num = Number(value);
        if (isNaN(num)) return 'R$ 0,00';
        return new Intl.NumberFormat('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        }).format(num);
      };

      const handleUpdateCategory = (id, field, value) => {
        setCategories(categories.map(cat => {
          if (cat.id === id) {
            return { ...cat, [field]: field === 'percentage' ? Number(value) : value };
          }
          return cat;
        }));
      };

      const handleRemoveCategory = (id) => {
        setCategories(categories.filter(cat => cat.id !== id));
      };

      const handleAddCategory = () => {
        const randomColor = colorOptions[Math.floor(Math.random() * colorOptions.length)];
        const newCat = {
          id: Date.now(),
          name: 'Nova Conta',
          percentage: 0,
          color: randomColor.text,
          bg: randomColor.bg
        };
        setCategories([...categories, newCat]);
      };

      return (
        <div className="min-h-screen bg-slate-950 font-sans p-4 md:p-8 flex justify-center items-start pt-6">
          <div className="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden pb-10">
            
            {/* HEADER */}
            <div className="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
              <div className="flex items-center gap-2">
                <IconWallet className="text-purple-500" size={24} />
                <h1 className="text-xl font-bold tracking-tight">Divisor do JP</h1>
              </div>
              <button 
                onClick={() => setIsAdmin(!isAdmin)}
                className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full transition-colors"
              >
                {isAdmin ? <IconArrowLeft size={20} className="text-slate-300"/> : <IconSettings size={20} className="text-slate-300"/>}
              </button>
            </div>

            {/* TELA PRINCIPAL */}
            {!isAdmin && (
              <div className="p-6 space-y-6">
                <div className="space-y-2">
                  <label className="text-sm font-medium text-slate-400">Quanto entrou na conta hoje?</label>
                  <div className="relative">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">R$</span>
                    <input 
                      type="number"
                      value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      placeholder="0.00"
                      className="w-full bg-slate-950 border border-slate-800 rounded-2xl py-4 pl-12 pr-4 text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all placeholder:text-slate-700 text-white"
                    />
                  </div>
                </div>

                {!isTotalValid && (
                  <div className="bg-yellow-500/10 border border-yellow-500/20 rounded-xl p-3 flex gap-2 items-start text-yellow-500 text-sm">
                    <IconAlertCircle size={18} className="shrink-0 mt-0.5" />
                    <p>Opa! As porcentagens somam {totalPercentage}%. Ajuste na engrenagem pra bater 100%.</p>
                  </div>
                )}

                <div className="space-y-3 pt-2">
                  <h2 className="text-sm font-medium text-slate-400 mb-3 flex items-center gap-2">
                    <IconPieChart size={16} /> Como dividir esse dinheiro:
                  </h2>
                  
                  {categories.map((cat) => {
                    const calculatedValue = (Number(amount || 0) * (cat.percentage / 100));
                    return (
                      <div key={cat.id} className={`${cat.bg} border border-slate-800/50 rounded-2xl p-4 flex justify-between items-center transition-all`}>
                        <div className="flex flex-col">
                          <span className={`text-sm font-semibold ${cat.color}`}>{cat.name}</span>
                          <span className="text-xs text-slate-400">{cat.percentage}%</span>
                        </div>
                        <div className="text-xl font-bold text-slate-100">
                          {formatCurrency(calculatedValue)}
                        </div>
                      </div>
                    );
                  })}
                </div>
                
                <div className="pt-6 text-center">
                  <p className="text-xs text-slate-500">Bora pra cima, JP! Foco na Unigrande e no trampo! 🚀</p>
                </div>
              </div>
            )}

            {/* TELA DE CONFIGURAÇÃO (ADMIN) */}
            {isAdmin && (
              <div className="p-6 space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-lg font-bold">Ajustar Regras</h2>
                  <div className={`px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1 ${isTotalValid ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                    {isTotalValid ? <IconCheckCircle2 size={16}/> : <IconAlertCircle size={16}/>}
                    Total: {totalPercentage}%
                  </div>
                </div>

                <div className="space-y-4">
                  {categories.map((cat) => (
                    <div key={cat.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col gap-3">
                      <div className="flex justify-between gap-3">
                        <input 
                          type="text" 
                          value={cat.name}
                          onChange={(e) => handleUpdateCategory(cat.id, 'name', e.target.value)}
                          className="flex-1 bg-transparent border-b border-slate-800 focus:border-purple-500 py-1 outline-none font-medium text-slate-200"
                          placeholder="Nome da categoria"
                        />
                        <button 
                          onClick={() => handleRemoveCategory(cat.id)}
                          className="text-slate-500 hover:text-red-400 transition-colors p-1"
                        >
                          <IconTrash2 size={18} />
                        </button>
                      </div>
                      <div className="flex items-center gap-3">
                        <input 
                          type="range" 
                          min="0" max="100" 
                          value={cat.percentage}
                          onChange={(e) => handleUpdateCategory(cat.id, 'percentage', e.target.value)}
                          className="flex-1 accent-purple-500"
                        />
                        <div className="w-16 flex items-center bg-slate-900 rounded-lg px-2 py-1 border border-slate-800">
                          <input 
                            type="number" 
                            value={cat.percentage}
                            onChange={(e) => handleUpdateCategory(cat.id, 'percentage', e.target.value)}
                            className="w-full bg-transparent outline-none text-right font-bold text-sm text-white"
                          />
                          <span className="text-slate-400 text-xs ml-1">%</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <button 
                  onClick={handleAddCategory}
                  className="w-full py-4 border-2 border-dashed border-slate-700 rounded-xl text-slate-400 font-medium flex justify-center items-center gap-2 active:bg-slate-800 transition-all"
                >
                  <IconPlus size={20} />
                  Adicionar Nova Categoria
                </button>

                {!isTotalValid && (
                  <p className="text-center text-sm text-red-400 font-medium">
                    O total precisa ser exatamente 100% para o cálculo ficar certo.
                  </p>
                )}
                
                <button 
                  onClick={() => setIsAdmin(false)}
                  className="w-full bg-purple-600 active:bg-purple-700 text-white font-bold py-4 rounded-xl transition-colors mt-4 text-lg"
                >
                  Salvar e Voltar
                </button>
              </div>
            )}
            
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
